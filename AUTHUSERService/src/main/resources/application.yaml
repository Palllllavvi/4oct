server:
  port: 8081

spring:
  application:
    name: AUTHUSER-SERVICE

  datasource:
    url: jdbc:h2:mem:authdb

  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"