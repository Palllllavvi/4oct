server:
  port: 8084

spring:
  application:
    name: CLAIM-SERVICE

  datasource:
    url: jdbc:h2:mem:claimdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: Secure360SuperSecretKeyForJwtAuthenticationFreelancerProtectionPlatform2026!
    expiration-ms: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.example.claimsservice: INFO